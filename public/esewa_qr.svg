<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="500" height="620" fill="#FFFFFF" rx="24" />
  
  <!-- Outer Frame Border -->
  <rect x="12" y="12" width="476" height="596" fill="none" stroke="#F0EBE5" stroke-width="2" rx="20" />

  <!-- QR CODE MATRIX AREA -->
  <g transform="translate(50, 40)">
    <!-- White QR Container -->
    <rect width="400" height="400" fill="#FFFFFF" />

    <!-- Corner Finder Pattern 1: Top-Left -->
    <rect x="0" y="0" width="112" height="112" fill="#1C1B1A" rx="8" />
    <rect x="16" y="16" width="80" height="80" fill="#FFFFFF" rx="4" />
    <rect x="32" y="32" width="48" height="48" fill="#1C1B1A" rx="2" />

    <!-- Corner Finder Pattern 2: Top-Right -->
    <rect x="288" y="0" width="112" height="112" fill="#1C1B1A" rx="8" />
    <rect x="304" y="16" width="80" height="80" fill="#FFFFFF" rx="4" />
    <rect x="320" y="32" width="48" height="48" fill="#1C1B1A" rx="2" />

    <!-- Corner Finder Pattern 3: Bottom-Left -->
    <rect x="0" y="288" width="112" height="112" fill="#1C1B1A" rx="8" />
    <rect x="16" y="304" width="80" height="80" fill="#FFFFFF" rx="4" />
    <rect x="32" y="320" width="48" height="48" fill="#1C1B1A" rx="2" />

    <!-- Alignment Pattern Bottom-Right -->
    <rect x="296" y="296" width="48" height="48" fill="#1C1B1A" rx="4" />
    <rect x="308" y="308" width="24" height="24" fill="#FFFFFF" rx="2" />
    <rect x="316" y="316" width="8" height="8" fill="#1C1B1A" />

    <!-- Timing Patterns -->
    <g fill="#1C1B1A">
      <rect x="128" y="48" width="16" height="16" />
      <rect x="160" y="48" width="16" height="16" />
      <rect x="192" y="48" width="16" height="16" />
      <rect x="224" y="48" width="16" height="16" />
      <rect x="256" y="48" width="16" height="16" />

      <rect x="48" y="128" width="16" height="16" />
      <rect x="48" y="160" width="16" height="16" />
      <rect x="48" y="192" width="16" height="16" />
      <rect x="48" y="224" width="16" height="16" />
      <rect x="48" y="256" width="16" height="16" />
    </g>

    <!-- Data Modules (High-Density QR Matrix) -->
    <g fill="#1C1B1A">
      <!-- Row 1 -->
      <rect x="128" y="0" width="16" height="16" />
      <rect x="160" y="0" width="16" height="32" />
      <rect x="208" y="0" width="32" height="16" />
      <rect x="256" y="0" width="16" height="16" />

      <!-- Row 2 -->
      <rect x="144" y="16" width="16" height="16" />
      <rect x="192" y="16" width="16" height="16" />
      <rect x="240" y="16" width="32" height="16" />

      <!-- Row 3 -->
      <rect x="128" y="32" width="32" height="16" />
      <rect x="176" y="32" width="16" height="16" />
      <rect x="224" y="32" width="32" height="16" />

      <!-- Middle Data Grid -->
      <rect x="128" y="128" width="32" height="32" />
      <rect x="176" y="128" width="16" height="16" />
      <rect x="208" y="128" width="48" height="16" />
      <rect x="272" y="128" width="32" height="32" />

      <rect x="144" y="176" width="16" height="48" />
      <rect x="176" y="160" width="32" height="16" />
      <rect x="224" y="160" width="16" height="32" />
      <rect x="256" y="176" width="32" height="16" />

      <rect x="128" y="224" width="16" height="32" />
      <rect x="176" y="208" width="48" height="16" />
      <rect x="240" y="208" width="16" height="48" />
      <rect x="272" y="224" width="16" height="16" />

      <rect x="160" y="256" width="32" height="16" />
      <rect x="208" y="256" width="16" height="32" />
      <rect x="272" y="256" width="32" height="16" />

      <!-- Bottom Right Data Grid -->
      <rect x="128" y="288" width="32" height="16" />
      <rect x="176" y="288" width="16" height="32" />
      <rect x="208" y="304" width="32" height="16" />
      <rect x="256" y="288" width="16" height="16" />
      <rect x="360" y="288" width="40" height="16" />

      <rect x="128" y="320" width="16" height="32" />
      <rect x="160" y="336" width="32" height="16" />
      <rect x="224" y="320" width="16" height="48" />
      <rect x="256" y="336" width="32" height="16" />
      <rect x="352" y="320" width="16" height="32" />

      <rect x="144" y="368" width="32" height="16" />
      <rect x="192" y="368" width="16" height="32" />
      <rect x="256" y="368" width="16" height="32" />
      <rect x="288" y="352" width="32" height="16" />
      <rect x="336" y="368" width="64" height="16" />

      <!-- Extra Right Data Columns -->
      <rect x="320" y="128" width="16" height="32" />
      <rect x="352" y="128" width="32" height="16" />
      <rect x="336" y="176" width="16" height="48" />
      <rect x="368" y="160" width="32" height="16" />
      <rect x="320" y="240" width="48" height="16" />
      <rect x="384" y="224" width="16" height="48" />
    </g>
  </g>

  <!-- ESEWA BRAND LOGO BADGE -->
  <g transform="translate(145, 465)">
    <!-- eSewa Green Circle Logo -->
    <circle cx="28" cy="28" r="24" fill="#60BB46" />
    <text x="28" y="36" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" font-family="serif">e</text>
    
    <!-- eSewa Text Brand -->
    <text x="64" y="38" font-size="38" font-weight="800" fill="#1C1B1A" letter-spacing="-0.5">Sewa</text>
    <text x="175" y="20" font-size="12" font-weight="700" fill="#736C65">TM</text>
  </g>

  <!-- SAHINA SHRESTHA ACCOUNT NAME -->
  <g transform="translate(250, 555)">
    <text x="0" y="0" font-size="30" font-weight="800" fill="#2C2927" text-anchor="middle" letter-spacing="0.2">Sahina Shrestha</text>
    <text x="0" y="22" font-size="14" font-weight="700" fill="#60BB46" text-anchor="middle" letter-spacing="1">eSewa ID: 9767573721</text>
  </g>
</svg>
