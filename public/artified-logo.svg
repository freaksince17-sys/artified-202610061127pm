<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 145" fill="none">
  <defs>
    <filter id="brush-filter" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <radialGradient id="pearl-shimmer" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FFF9F2" />
      <stop offset="70%" stop-color="#EFE4D6" />
      <stop offset="90%" stop-color="#DFCDB8" />
      <stop offset="100%" stop-color="#C4B097" />
    </radialGradient>

    <linearGradient id="pearl-gloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <filter id="pearl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

